# Working example, not a universal outline. Replace its subject and argument.
version: 1
brief:
  title: Как объяснить техническую идею
  audience: Студенты технического вуза
  takeaway: Каждый слайд отвечает на вопрос, а выбранная форма помогает проверить ответ.
  minutes: 8
  language: Русский текст, английские названия инструментов
  author: Пример для адаптации
sources:
  - id: style
    title: Общий гайд по техническим презентациям
    location: PRESENTATION_GUIDE.md в корне инструментов
    description: Локальные правила повествования, оформления и проверки
slides:
  - id: opening
    title: Как объяснить техническую идею
    layout: cover
    subtitle: Вопрос слушателя и подходящая форма объяснения
    purpose: Назвать предмет и дать ориентир для выступления
    minutes: 0.5
    transition: Сначала определим, что слушатель должен понять к концу объяснения.
    script:
      see: На белом фоне название, подзаголовок и строка автора. Они задают предмет и ожидаемый результат выступления.
      message: Форма презентации должна помогать понимать содержание.
      speech: Сегодня разберём, как превратить технический материал в последовательное объяснение. Нас интересует связь между вопросом слушателя и формой слайда. Мы сравним несколько способов подачи, а затем выберем форму для определения, сравнения и процесса. Этот файл служит примером оформления. При подготовке своей темы нужно заменить и текст, и линию рассуждения.
  - id: question
    title: Вопрос определяет содержание слайда
    layout: prose
    purpose: Связать выбор содержания с задачей аудитории
    minutes: 1.5
    body:
      - Прежде чем выбирать рисунок, сформулируйте вопрос слушателя. Для объяснения устройства нужны связи между частями. Для выбора решения нужны критерии сравнения, а для обсуждения результата нужны данные и условия их получения.
      - Слайд даёт один содержательный ответ. Подробности, которые помогают произнести этот ответ, переходят в отдельный сценарий. Так изображение и речь дополняют друг друга.
    transition: Посмотрим, как один материал меняется при переходе от списка к объяснению.
    sources: [style]
    script:
      see: Два связанных абзаца. Первый различает задачи слушателя, второй объясняет разделение слайда и устной речи.
      message: Содержание выбирают по вопросу аудитории.
      speech: |
        Возьмём один технический материал, например описание системы хранения. Можно показать состав компонентов, сравнить варианты или объяснить результат измерения. Это разные задачи. У схемы связей и сравнительной таблицы будут разные подписи, даже если предмет остаётся тем же.

        Поэтому подготовка начинается с вопроса аудитории. Ответ определяет, что должно быть видно, какие условия надо назвать и что стоит объяснить голосом. На этом слайде используются два абзаца, потому что здесь важна причинная связь. Превращение их в три одинаковых пункта не добавило бы ясности.

        Отдельный сценарий нужен для примеров и пояснений. Он помогает готовиться к выступлению, а слайд сохраняет обозримую структуру. Слушатель должен видеть материал, к которому относится текущая фраза, и понимать его роль в ответе.
  - id: comparison
    title: Список и объяснение решают разные задачи
    layout: compare
    purpose: Показать разницу между перечислением и объяснением механизма
    minutes: 1.5
    columns:
      - title: Перечисление
        body:
          - Список помогает проверить комплектность. Он удобен, когда слушателю нужно увидеть набор требований или названий и убедиться, что ничего не пропущено.
      - title: Объяснение
        body:
          - Связный текст показывает механизм и причину. Он нужен, когда важно понять, как изменение одного условия влияет на результат и почему возникает ограничение.
    takeaway: Выбор зависит от вопроса слушателя. Список не обязан заменять весь рассказ.
    transition: Теперь рассмотрим материал, в котором важен порядок действий.
    script:
      see: Две равные текстовые колонки с короткими заголовками. Нижняя строка связывает сравнение с общей задачей.
      message: Текстовые формы выбирают по смыслу, а не ради одинакового вида.
      speech: |
        Слева показана задача перечисления. Если нужно назвать требования к файлам или элементы набора, список позволяет быстро проверить наличие каждого пункта. Это полезная форма, и отказываться от неё полностью не нужно.

        Справа другая задача. Слушатель хочет понять механизм. Например, почему увеличение числа измерений меняет время расчёта. Здесь нужно связать условие, действие и следствие. Короткий связный абзац может передать эту связь точнее, чем несколько отдельных названий.

        Мы сравниваем не качество двух форм, а их назначение. У каждой есть подходящий вопрос. Похожим образом далее выберем форму для последовательности. Если порядок важен, его следует показать явно, чтобы слушателю не приходилось восстанавливать его из текста.
      action: Укажите на левую и правую колонки, затем прочитайте общую нижнюю строку.
  - id: sequence
    title: Порядок действий раскрывает зависимости
    layout: procedure
    purpose: Объяснить, когда нумерованная последовательность полезнее абзаца
    minutes: 1.5
    steps:
      - Сначала задают исходные условия. Без них нельзя понять, к какому случаю относится результат и с чем его допустимо сравнивать.
      - Затем выполняют действие или преобразование. На этом шаге объясняют механизм и указывают, какие величины меняются.
      - В конце сопоставляют результат с исходным вопросом. Ограничения помогают определить, где вывод остаётся применимым.
    transition: Для нескольких вариантов с общими признаками удобнее перейти от последовательности к таблице.
    script:
      see: Три пронумерованных шага в одну колонку. Каждый шаг содержит действие и причину его места в последовательности.
      message: Нумерация полезна, когда порядок несёт смысл.
      speech: |
        Здесь порядок действительно влияет на понимание. Сначала нужно узнать условия, затем увидеть действие и только после этого оценить результат. Если поменять эти части местами, придётся возвращаться к уже показанной информации.

        Обратите внимание, что у каждого шага есть объяснение. Одни названия этапов не раскрывают механизм. Исходные условия задают область применимости, преобразование связывает вход и выход, а сравнение с вопросом помогает сделать вывод.

        Эта форма подходит для алгоритма, эксперимента или процедуры проверки. Число шагов определяется содержанием. Если один шаг занимает почти весь слайд, последовательность стоит разделить. Следующий слайд понадобится по другой причине: когда порядок исчезает, а появляются общие критерии для нескольких вариантов, таблица становится удобнее.
  - id: selection
    title: Форма слайда соответствует задаче
    layout: table
    purpose: Сопоставить формы с типами материала
    minutes: 1.5
    body:
      - Сравнение по одинаковым признакам удобно читать по строкам. Таблица сохраняет общие критерии и показывает, зачем выбирают каждую форму.
    table:
      header: [Форма, Вопрос, Что показать]
      widths: [0.2, 0.35, 0.45]
      rows:
        - [Абзац, "Почему это происходит?", Причину и следствие]
        - [Сравнение, "Чем различаются варианты?", Одинаковые критерии]
        - [Последовательность, "Каков порядок действий?", Зависимости между этапами]
        - [Рисунок, "Как устроен объект?", Связи и обозначения]
    transition: Соберём критерии, по которым можно оценить выбранное объяснение.
    script:
      see: Короткое вступление и редактируемая таблица из трёх колонок. Строки сопоставляют форму, вопрос и содержание изображения.
      message: Общие критерии помогают осмысленно выбрать компоновку.
      speech: |
        Таблица нужна, когда несколько объектов сравниваются по одним признакам. Здесь каждый вариант формы отвечает на свой вопрос. Мы читаем строку целиком и видим связь между задачей и тем, что должен содержать слайд.

        Абзац объясняет причину, сравнение удерживает одинаковые критерии, последовательность показывает порядок. Рисунок нужен там, где сами пространственные связи помогают понять объект. У рисунка должны быть читаемые подписи и обозначения, а его размер определяется необходимостью различать эти детали.

        Эту таблицу можно использовать как начальную проверку плана. Но она не задаёт обязательный набор макетов для каждого выступления. Выбранная тема может требовать нескольких рисунков подряд. Главное, чтобы каждый из них отвечал на новый вопрос и продвигал объяснение.
      action: Пройдите по одной строке целиком, затем предложите аудитории подобрать форму для своего примера.
  - id: conclusion
    title: Связный рассказ помогает проверить вывод
    layout: conclusion
    purpose: Вернуться к исходному тезису и сформулировать критерий качества
    minutes: 1
    body:
      - Сначала определяют вопрос аудитории, затем выбирают материал и подходящую форму. Переходы показывают, зачем появляется следующий пример и какой предыдущий вопрос он уточняет.
      - Читаемость изображения проверяют в масштабе слайда. Главный вывод должен опираться на показанный материал, а сценарий выступления объясняет детали, которые помогают его понять.
    transition: В конце оставим источник правил для дальнейшей подготовки.
    sources: [style]
    script:
      see: Два итоговых абзаца. Они возвращают обсуждение к вопросу аудитории и связывают повествование с читаемостью.
      message: Хорошее объяснение позволяет восстановить путь от вопроса к выводу.
      speech: Подведём итог. У каждой формы есть назначение. Чтобы выбрать её, сначала нужно определить вопрос слушателя. Затем мы отбираем материал, показываем важные связи и формулируем вывод. Переходы между слайдами помогают понять, зачем появился новый пример. После сборки полезно прочитать одни заголовки, а потом посмотреть на рисунки в реальном размере. Так можно проверить последовательность рассказа и различимость деталей. Автоматическая проверка оформления помогает находить дефекты, но связность и точность объяснения требуют содержательного просмотра.
  - id: sources
    title: Источник правил и примеров
    layout: sources
    purpose: Дать описание использованного локального руководства
    minutes: 0.5
    sources: [style]
    script:
      see: Библиографическая строка с названием локального руководства. Полное расположение источника указано в конце сценария.
      message: Правила оформления можно повторно использовать для другой темы.
      speech: Здесь указан локальный гайд, по которому собран пример. В собственной презентации замените его источниками по вашей теме, добавьте данные и происхождение иллюстраций. Содержание этого примера показывает варианты подачи, а общий стиль и проверки позволяют сохранить похожее оформление при работе над новым материалом.
